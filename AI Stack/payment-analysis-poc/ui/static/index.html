<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Analysis Agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #22263a;
      --border:      #2e3250;
      --accent:      #5b6eff;
      --accent-dim:  #3d4fbf;
      --text:        #e2e4f0;
      --text-muted:  #7a7f9a;
      --user-bubble: #2a2f4a;
      --agent-bubble:#1e2235;
      --tool-bg:     #1a2240;
      --tool-border: #3050a0;
      --error:       #ff5a5a;
      --radius:      12px;
      --radius-sm:   8px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 15px; font-weight: 600; }
    header p  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    .header-actions { display: flex; gap: 8px; }

    .hdr-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all .15s;
    }
    .hdr-btn:hover { border-color: var(--accent); color: var(--text); }
    #clear-cache-btn:hover { border-color: #f0a030; color: #f0a030; }

    /* ── Messages ───────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Welcome screen ─────────────────────────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
      text-align: center;
      padding: 40px 0;
    }

    .welcome-icon {
      width: 56px; height: 56px;
      background: var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }

    .welcome h2 { font-size: 20px; font-weight: 600; }
    .welcome p  { font-size: 14px; color: var(--text-muted); max-width: 420px; line-height: 1.6; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      color: var(--text);
    }
    .suggestion-chip:hover {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Message rows ───────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 12px;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

    .msg-row.user  { flex-direction: row-reverse; }
    .msg-row.agent { flex-direction: row; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }

    .msg-row.user  .avatar { background: var(--accent-dim); }
    .msg-row.agent .avatar { background: #2e3250; }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
    }

    .msg-row.user  .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }
    .msg-row.agent .bubble {
      background: var(--agent-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* ── Tool call chips ────────────────────────────────────────── */
    .tool-activity {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 44px; /* align with agent bubbles */
    }

    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: #8ab4f8;
      width: fit-content;
      animation: fadeIn .2s ease;
    }

    .tool-chip .spinner {
      width: 10px; height: 10px;
      border: 2px solid #3050a0;
      border-top-color: #8ab4f8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    .tool-chip.done .spinner {
      display: none;
    }
    .tool-chip.done::before {
      content: "✓";
      color: #4ade80;
      font-size: 11px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Thinking indicator ─────────────────────────────────────── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 44px;
      font-size: 13px;
      color: var(--text-muted);
      animation: fadeIn .2s ease;
    }

    .thinking-dots { display: flex; gap: 4px; }
    .thinking-dots span {
      width: 5px; height: 5px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .2s; }
    .thinking-dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Markdown styles inside bubbles ─────────────────────────── */
    .bubble h1, .bubble h2, .bubble h3 {
      margin: 12px 0 6px;
      font-size: 14px;
      color: var(--text);
    }
    .bubble h2 { font-size: 13px; }
    .bubble p  { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }

    .bubble ul, .bubble ol {
      margin: 6px 0 8px 18px;
    }
    .bubble li { margin-bottom: 4px; }

    .bubble code {
      background: var(--surface2);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
    }
    .bubble pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .bubble pre code { background: none; padding: 0; }

    .bubble strong { color: #c5caff; }

    .bubble table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 8px 0;
    }
    .bubble th, .bubble td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .bubble th { background: var(--surface2); }

    .bubble hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }

    .bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--text-muted);
      margin: 6px 0;
    }

    /* ── Provider selector ──────────────────────────────────────── */
    .provider-selector {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .provider-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .provider-btn:hover { color: var(--text); background: var(--surface2); }
    .provider-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Active model badge ─────────────────────────────────────── */
    .model-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .model-badge .model-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }
    .model-badge .model-dot.ollama { background: #f0a030; }
    .model-badge span { font-family: "JetBrains Mono", "Fira Code", monospace; }

    /* ── Provider switch notice ─────────────────────────────────── */
    .provider-notice {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 44px;
      font-size: 12px;
      color: #f0a030;
      animation: fadeIn .2s ease;
    }

    /* ── Cache hit badge ────────────────────────────────────────── */
    .cache-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1a2a10;
      border: 1px solid #3a6020;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: #7ecf50;
      margin-bottom: 8px;
    }

    /* ── Error bubble ───────────────────────────────────────────── */
    .bubble.error {
      background: #2a1a1a;
      border-color: #5a2a2a;
      color: var(--error);
      font-size: 13px;
    }

    /* ── Input area ─────────────────────────────────────────────── */
    .input-area {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color .15s;
    }
    .input-row:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-dim); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }

    #send-btn svg { width: 16px; height: 16px; fill: white; }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="layout">

  <!-- Header -->
  <header>
    <div class="header-title">
      <div class="header-icon">💳</div>
      <div>
        <h1>Payment Analysis Agent</h1>
        <p>ACH file analysis · Client database · Jan–Jun 2026</p>
      </div>
    </div>
    <div class="header-actions">
      <div class="model-badge" id="model-badge" title="Active model">
        <div class="model-dot" id="model-dot"></div>
        <span id="model-label">loading…</span>
      </div>
      <div class="provider-selector" title="Choose which AI provider to use">
        <button class="provider-btn active" data-provider="auto">Auto</button>
        <button class="provider-btn" data-provider="primary">External</button>
        <button class="provider-btn" data-provider="ollama">Ollama</button>
      </div>
      <button class="hdr-btn" id="clear-cache-btn" title="Clear the semantic response cache">🗑 Clear cache</button>
      <button class="hdr-btn" id="clear-btn">Clear chat</button>
    </div>
  </header>

  <!-- Messages -->
  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">💳</div>
      <h2>Payment Analysis Agent</h2>
      <p>Ask me to analyse ACH payment files or query the client database.
         I'll pull data from MinIO and SQL Server in real time.</p>
      <div class="suggestions">
        <button class="suggestion-chip" data-msg="Analyse all payment files in the Active folder and give me a full breakdown by company">
          📂 Analyse Active
        </button>
        <button class="suggestion-chip" data-msg="Search Archive for companies with high credit volumes over the past 12 months">
          🗄 Search Archive
        </button>
        <button class="suggestion-chip" data-msg="Which clients show suspicious or anomalous activity? Check the database for SUSPENDED or CLOSED accounts, then fetch the Active folder ACH files to see if any current batches have unusual debit spikes or return rates.">
          🚨 Suspicious activity
        </button>
        <button class="suggestion-chip" data-msg="Show me the transaction trend for VERTEX TECHNOLOGIES — they are a high-growth SaaS company">
          📈 Vertex growth trend
        </button>
        <button class="suggestion-chip" data-msg="Search Archive for HARBOR LOGISTICS or PINNACLE TRADING — I want to understand why they stopped processing">
          ⚠️ Churned clients
        </button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" rows="1" placeholder="Ask about payment files or clients…"></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <p class="input-hint">Enter to send · Shift+Enter for new line</p>
  </div>

</div>

<script>
  // ── Session ID (persisted for multi-turn within the browser tab) ──────────
  const SESSION_ID = crypto.randomUUID();

  // ── Provider state ────────────────────────────────────────────────────────
  let activeProvider = "auto";

  // ── Model badge ───────────────────────────────────────────────────────────
  const modelDot   = document.getElementById("model-dot");
  const modelLabel = document.getElementById("model-label");
  let providers    = {};

  async function loadProviders() {
    try {
      const data = await fetch("/providers").then(r => r.json());
      providers = data;
      updateModelBadge("primary");
    } catch { modelLabel.textContent = "unavailable"; }
  }

  function updateModelBadge(which) {
    const isOllama = which === "ollama";
    const info     = providers[which] || {};
    modelDot.className   = "model-dot" + (isOllama ? " ollama" : "");
    modelLabel.textContent = info.model || which;
  }

  loadProviders();

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const messagesEl     = document.getElementById("messages");
  const welcomeEl      = document.getElementById("welcome");
  const inputEl        = document.getElementById("user-input");
  const sendBtn        = document.getElementById("send-btn");
  const clearBtn       = document.getElementById("clear-btn");
  const clearCacheBtn  = document.getElementById("clear-cache-btn");
  const providerBtns   = document.querySelectorAll(".provider-btn");

  // ── Provider selector ─────────────────────────────────────────────────────
  providerBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      activeProvider = btn.dataset.provider;
      providerBtns.forEach(b => b.classList.toggle("active", b === btn));
      // update badge: auto shows primary until a switch event overrides it
      updateModelBadge(activeProvider === "ollama" ? "ollama" : "primary");
    });
  });

  // ── Marked config ─────────────────────────────────────────────────────────
  marked.setOptions({ breaks: true, gfm: true });

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  // ── Keyboard shortcut ─────────────────────────────────────────────────────
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Suggestion chips ──────────────────────────────────────────────────────
  document.querySelectorAll(".suggestion-chip").forEach(chip => {
    chip.addEventListener("click", () => sendMessage(chip.dataset.msg));
  });

  // ── Clear cache ───────────────────────────────────────────────────────────
  clearCacheBtn.addEventListener("click", async () => {
    clearCacheBtn.disabled = true;
    clearCacheBtn.textContent = "Clearing…";
    await fetch("/cache", { method: "DELETE" });
    clearCacheBtn.disabled = false;
    clearCacheBtn.textContent = "🗑 Clear cache";
  });

  // ── Clear chat ────────────────────────────────────────────────────────────
  clearBtn.addEventListener("click", async () => {
    await fetch("/chat", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: SESSION_ID }),
    });
    // Remove all messages except welcome
    Array.from(messagesEl.children).forEach(el => {
      if (el !== welcomeEl) el.remove();
    });
    welcomeEl.style.display = "flex";
  });

  // ── Send button ───────────────────────────────────────────────────────────
  sendBtn.addEventListener("click", () => sendMessage());

  // ── Helpers ───────────────────────────────────────────────────────────────

  function appendUserMsg(text) {
    welcomeEl.style.display = "none";
    const row = document.createElement("div");
    row.className = "msg-row user";
    row.innerHTML = `
      <div class="avatar">🧑</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // Container for live tool chips + thinking indicator during a response
  let activityEl  = null;
  let thinkingEl  = null;
  let agentBubble = null;
  let tokenBuf    = [];   // accumulates streaming tokens before markdown render

  function startAgentTurn() {
    activityEl = document.createElement("div");
    activityEl.className = "tool-activity";
    messagesEl.appendChild(activityEl);

    thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking";
    thinkingEl.innerHTML = `
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      Thinking…
    `;
    messagesEl.appendChild(thinkingEl);
    scrollBottom();
  }

  function addToolChip(name) {
    const label = name.replace(/_/g, " ");
    const chip  = document.createElement("div");
    chip.className    = "tool-chip";
    chip.dataset.name = name;
    chip.innerHTML    = `<div class="spinner"></div> ${label}`;
    activityEl.appendChild(chip);
    scrollBottom();
    return chip;
  }

  function finishToolChip(name) {
    const chip = activityEl.querySelector(`[data-name="${name}"]`);
    if (chip) chip.classList.add("done");
  }

  function _ensureAgentBubble() {
    if (agentBubble) return;
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    const row = document.createElement("div");
    row.className = "msg-row agent";
    agentBubble = document.createElement("div");
    agentBubble.className = "bubble";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🤖";
    row.appendChild(avatar);
    row.appendChild(agentBubble);
    messagesEl.appendChild(row);
  }

  function appendToken(token) {
    _ensureAgentBubble();
    tokenBuf.push(token);
    // Show raw text while streaming – snaps to markdown on message event
    agentBubble.textContent = tokenBuf.join("");
    scrollBottom();
  }

  function showAnswer(markdown, cacheLabel = null) {
    tokenBuf = [];
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }

    if (!agentBubble) {
      const row = document.createElement("div");
      row.className = "msg-row agent";
      agentBubble = document.createElement("div");
      agentBubble.className = "bubble";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "🤖";
      row.appendChild(avatar);
      row.appendChild(agentBubble);
      messagesEl.appendChild(row);
    }

    if (cacheLabel) {
      agentBubble.innerHTML =
        `<div class="cache-badge">${cacheLabel}</div>` + marked.parse(markdown);
    } else {
      agentBubble.innerHTML = marked.parse(markdown);
    }
    agentBubble = null;   // reset for next turn
    scrollBottom();
  }

  function clearCurrentResponse() {
    // Called when provider switches mid-stream – clears the partial bubble
    tokenBuf = [];
    if (agentBubble) {
      agentBubble.closest(".msg-row")?.remove();
      agentBubble = null;
    }
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    if (activityEl) { activityEl.innerHTML = ""; }
  }

  function showError(msg) {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    const row = document.createElement("div");
    row.className = "msg-row agent";
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble error">⚠ ${escHtml(msg)}</div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function showProviderNotice(from, to) {
    const labels = { primary: "External", ollama: "Ollama", auto: "Auto" };
    const notice = document.createElement("div");
    notice.className = "provider-notice";
    notice.innerHTML = `⚡ Rate/quota limit hit on <strong>${labels[from] || from}</strong> — switched to <strong>${labels[to] || to}</strong>`;
    messagesEl.appendChild(notice);
    scrollBottom();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Main send function ────────────────────────────────────────────────────

  async function sendMessage(override) {
    const text = (override || inputEl.value).trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    agentBubble = null;
    tokenBuf    = [];
    appendUserMsg(text);
    startAgentTurn();

    // Track last tool name to mark it done when the next one starts
    let lastToolName = null;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: SESSION_ID, provider: activeProvider }),
      });

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buf     = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          let evt;
          try { evt = JSON.parse(line.slice(6)); } catch { continue; }

          if (evt.type === "token") {
            // Live streaming token – append to bubble before markdown render
            if (lastToolName) { finishToolChip(lastToolName); lastToolName = null; }
            appendToken(evt.content || "");
          }

          if (evt.type === "tool_call") {
            if (lastToolName) finishToolChip(lastToolName);
            lastToolName = evt.name;
            addToolChip(evt.name);
          }

          if (evt.type === "cache_hit") {
            if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
            if (activityEl) { activityEl.remove(); activityEl = null; }
            const ttl = evt.ttl_hours ?? 24;
            showAnswer(evt.content || "", `⚡ From cache · refreshes every ${ttl}h`);
          }

          if (evt.type === "message") {
            // Final event – re-render accumulated tokens as proper markdown
            if (lastToolName) finishToolChip(lastToolName);
            lastToolName = null;
            showAnswer(evt.content || "", null);
          }

          if (evt.type === "clear_response") {
            // Provider switched mid-stream – clear partial response
            clearCurrentResponse();
          }

          if (evt.type === "provider_switch") {
            showProviderNotice(evt.from_provider, evt.to_provider);
            updateModelBadge(evt.to_provider);
          }

          if (evt.type === "error") {
            showError(evt.content || "Unknown error");
          }

          if (evt.type === "done") {
            if (lastToolName) finishToolChip(lastToolName);
            agentBubble = null;
            tokenBuf    = [];
          }
        }
      }
    } catch (err) {
      showError(err.message);
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
