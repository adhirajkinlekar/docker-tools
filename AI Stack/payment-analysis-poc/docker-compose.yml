services:

  # ─── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: poc-minio
    ports:
      - "19000:9000"   # S3 API
      - "19001:9001"   # Web console  →  http://localhost:19001
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
      # Webhook target "1": POSTs to the indexer when objects are created in
      # Archive/. The indexer registers the bucket notification
      # on startup via put_bucket_notification_configuration.
      MINIO_NOTIFY_WEBHOOK_ENABLE_1: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_1: "http://indexer:8001/webhook"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── SQL Server ───────────────────────────────────────────────────────────────
  mssql:
    build: ./db
    container_name: poc-mssql
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}", "-Q", "SELECT 1",
             "-C", "-N"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ─── ACH RAG Indexer ─────────────────────────────────────────────────────────
  indexer:
    build: ./indexer
    container_name: poc-indexer
    ports:
      - "8001:8001"
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastMCP server ───────────────────────────────────────────────────────────
  mcp-server:
    build: ./mcp-server
    container_name: poc-mcp-server
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MSSQL_SERVER: mssql
      MSSQL_DATABASE: PaymentDB
      MSSQL_USER: sa
      MSSQL_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}"
      INDEXER_URL: "http://indexer:8001"
    depends_on:
      minio:
        condition: service_healthy
      mssql:
        condition: service_healthy
      indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Seed: upload sample ACH files to MinIO ──────────────────────────────────
  seed:
    build: ./seed
    container_name: poc-seed
    environment:
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ─── Qdrant (vector DB for semantic response cache) ──────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: poc-qdrant
    ports:
      - "6334:6333"   # REST + gRPC  (host 6334 → container 6333)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Ollama (local LLM – OpenAI-compatible API) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: poc-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ─── Ollama init: pull the model once then exit ───────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: poc-ollama-init
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["sh", "-c", "ollama pull ${FALLBACK_MODEL:-llama3.2}; exit 0"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ─── Web UI  →  http://localhost:3000 ────────────────────────────────────────
  ui:
    build: ./ui
    container_name: poc-ui
    ports:
      - "3000:3000"
    environment:
      MCP_SERVER_URL: "http://mcp-server:8000/sse"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-ollama}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-http://ollama:11434/v1}"
      AGENT_MODEL: "${AGENT_MODEL:-llama3.2}"
      OLLAMA_BASE_URL: "http://ollama:11434/v1"
      FALLBACK_MODEL: "${FALLBACK_MODEL:-llama3.2}"
      QDRANT_URL: "http://qdrant:6333"
      CACHE_TTL_HOURS: "${CACHE_TTL_HOURS:-24}"
    depends_on:
      mcp-server:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  mssql_data:
  qdrant_data:
  ollama_data:
